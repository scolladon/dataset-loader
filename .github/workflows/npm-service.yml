---
name: NPM Service

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.publish.outputs.channel }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - uses: ./.github/actions/install

      - name: Publish
        id: publish
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm publish --provenance --access public --tag "latest-rc"
          echo "channel=dataset-loader@$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.publish-preview.outputs.urls }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - uses: ./.github/actions/install
        with:
          cache: restore

      - name: Publish preview
        id: publish-preview
        run: npx --yes pkg-pr-new@0.0.86 publish --comment=off

      - name: Record preview metadata
        env:
          PREVIEW_URL: ${{ steps.publish-preview.outputs.urls }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p preview
          printf '%s\n' "$PREVIEW_URL" > preview/url
          printf '%s\n' "$PR_NUMBER" > preview/pr-number

      - name: Upload preview metadata
        uses: actions/upload-artifact@v6
        with:
          name: preview-metadata
          path: preview

  e2e-tests:
    needs: [publish, preview]
    if: "!cancelled() && (needs.publish.result == 'success' || needs.preview.result == 'success')"
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      channel: ${{ needs.publish.outputs.channel || needs.preview.outputs.channel }}
