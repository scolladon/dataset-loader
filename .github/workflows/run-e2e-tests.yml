---
name: E2E Tests

on:
  workflow_call:
    inputs:
      channel:
        description: npm channel to install the plugin from
        required: true
        type: string

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    name: e2e (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    steps:
      - name: Guard channel input
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "$CHANNEL" ]; then
            echo "::error::channel input is empty" >&2
            exit 1
          fi

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install plugin
        run: echo y | sf plugins install ${{ inputs.channel }}

      - name: Verify plugin installation
        run: sf dataset load --help
