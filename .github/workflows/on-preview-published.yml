---
name: Preview Comment

on:
  workflow_run:
    workflows: ["NPM Service"]
    types: [completed]

permissions:
  contents: read

# The producing run is not cancelled on a new push once it has completed, so two
# runs can finish out of order. Keep one at a time per head branch and drop
# superseded ones, so a stale url never overwrites a newer comment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # Gate on the preview job alone, not on the whole run: a red e2e matrix is
      # exactly when the install command is most worth having on the pull request.
      - name: Resolve preview job outcome
        id: job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          CONCLUSION=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "preview")] | .[0].conclusion // empty')
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"

      - name: Download preview metadata
        if: steps.job.outputs.conclusion == 'success'
        uses: actions/download-artifact@v8
        with:
          name: preview-metadata
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve pull request number
        id: pr
        if: steps.job.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          NUMBER=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq "[.[] | select(.state == \"open\" and .head.repo.full_name == \"$HEAD_REPO\" and .head.ref == \"$HEAD_BRANCH\")] | .[0].number // empty")
          if [ -z "$NUMBER" ]; then
            echo "::warning::no open pull request for $HEAD_SHA on $HEAD_REPO:$HEAD_BRANCH - skipping"
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      # The artifact was written by a job that ran the pull request's own code, so
      # its contents are untrusted. Rebuild the url the preview must have from
      # trusted event context only, and accept the artifact solely when it agrees.
      - name: Resolve preview url
        id: preview
        if: steps.pr.outputs.number != ''
        env:
          PREVIEW_PREFIX: https://pkg.pr.new/
          PACKAGE_NAME: dataset-loader
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA=$(printf '%.7s' "$HEAD_SHA")
          EXPECTED="${PREVIEW_PREFIX}${PACKAGE_NAME}@${SHORT_SHA}"
          PUBLISHED=$(head -n 1 preview/url)
          if [ "$PUBLISHED" != "$EXPECTED" ]; then
            echo "::error::preview url does not match the expected build for $SHORT_SHA" >&2
            exit 1
          fi
          echo "url=$EXPECTED" >> "$GITHUB_OUTPUT"

      - name: Comment preview install command
        if: steps.preview.outputs.url != ''
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          message: |
            Preview build for this pull request:
            ```sh
            sf plugins install ${{ steps.preview.outputs.url }}
            ```
          comment-tag: dev-publish
          mode: recreate
